name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest deps)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        lowest: [false]
        include:
          - php: '8.2'
            lowest: true

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress ${{ matrix.lowest && '--prefer-lowest' || '' }}

      - name: Fetch the API contract for the drift check
        if: ${{ vars.QUOYER_OPENAPI_URL != '' }}
        run: curl -fsSL "${{ vars.QUOYER_OPENAPI_URL }}" -o "$RUNNER_TEMP/openapi.yaml" && echo "QUOYER_OPENAPI_PATH=$RUNNER_TEMP/openapi.yaml" >> "$GITHUB_ENV"

      - name: Code style
        if: ${{ !matrix.lowest }}
        run: vendor/bin/pint --test

      - name: Static analysis
        if: ${{ !matrix.lowest }}
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: vendor/bin/pest
